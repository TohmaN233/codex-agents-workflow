name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  workflow-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install pinned development dependencies
        working-directory: plugins/codex-agents-workflow/control-plane
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Type-check and compare committed web assets and licenses
        working-directory: plugins/codex-agents-workflow/control-plane
        run: npm run check:web
  isolation-probe-invariants:
    name: isolation-probe-invariants-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify discovery and synthetic probe invariants without credentials
        run: node --test spikes/skill-isolation/assertions.test.mjs spikes/skill-isolation/fixture-policy.test.mjs

  connector-matrix:
    name: connector-protocol-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check connector runtime and fixtures
        run: >-
          node --check plugins/codex-agents-workflow/control-plane/server.mjs &&
          node --check plugins/codex-agents-workflow/control-plane/connectors/cursor-cdp.mjs &&
          node --check plugins/codex-agents-workflow/control-plane/connectors/grok-acp.mjs &&
          node --check plugins/codex-agents-workflow/control-plane/test/fixtures/fake-cursor.mjs &&
          node --check plugins/codex-agents-workflow/control-plane/test/fixtures/fake-grok.mjs
      - name: Provide ffmpeg integration-test dependency on Linux
        if: runner.os == 'Linux'
        run: command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Provide ffmpeg integration-test dependency on macOS
        if: runner.os == 'macOS'
        run: command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null || brew install ffmpeg
      - name: Provide ffmpeg integration-test dependency on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue) -or -not (Get-Command ffprobe -ErrorAction SilentlyContinue)) { choco install ffmpeg --no-progress -y }
      - name: Run process and protocol connector tests
        run: node plugins/codex-agents-workflow/control-plane/test/run-tests.mjs
      - name: Verify cross-platform native role tools
        run: node --test plugins/codex-agents-workflow/scripts/test/native-role-tools.test.mjs

  full-verify:
    name: full-repository-verify
    needs: connector-matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Provide ffmpeg integration-test dependency
        run: command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Verify native Codex Agents Workflow core
        run: sh plugins/codex-agents-workflow/scripts/verify.sh
      - name: Verify configurable control plane
        run: sh plugins/codex-agents-workflow/scripts/verify-control-plane.sh
